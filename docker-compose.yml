services:
  db:
    image: mysql:8.0
    container_name: baloncesto_mesa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      # Fijo a propósito (debe coincidir con el nombre que crea database/schema.sql
      # y con DB_NAME en backend/.env). No lo hagas variable con DB_NAME aquí: si no
      # coincidiera con schema.sql, el usuario de la app se quedaría sin permisos
      # sobre la base de datos real.
      MYSQL_DATABASE: baloncesto_examen
      MYSQL_USER: ${DB_USER:-baloncesto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-baloncesto}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
